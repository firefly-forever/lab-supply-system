<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>领用申请 — 实验室耗材管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div class="main-wrap">
    <header class="header">
      <div class="header-title">领用申请</div>
      <div class="header-right">
        <div class="warning-pill" id="header-warning-pill" style="display:none"
             onclick="window.location.href='supply.html'">⚠️ <span class="warn-count"></span></div>
      </div>
    </header>
    <main class="main-content">
      <div class="card">
        <div class="page-header">
          <div class="page-title">我的申请记录</div>
          <!-- 学生才显示"新建申请"按钮 -->
          <button class="btn btn-primary" id="new-apply-btn" onclick="openApplyModal()">📋 新建申请</button>
        </div>

        <div class="toolbar">
          <select class="search-select" id="status-filter" onchange="loadList(1)">
            <option value="">全部状态</option>
            <option value="PENDING">待审批</option>
            <option value="APPROVED">已通过</option>
            <option value="REJECTED">已拒绝</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
            <tr>
              <th>申请时间</th><th>耗材名称</th><th>申请数量</th>
              <th>用途说明</th><th>状态</th><th>审批人</th>
              <th>审批意见</th><th>审批时间</th>
            </tr>
            </thead>
            <tbody id="app-tbody">
            <tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<script src="config.js"></script>
<script src="layout.js"></script>
<script>
  Layout.render('application')

  // 教师和管理员不能新建申请
  if (!Auth.isStudent()) {
    document.getElementById('new-apply-btn').style.display = 'none'
  }

  let supplies = []

  async function init() {
    // 学生才需要加载耗材列表（用于新建申请时下拉）
    if (Auth.isStudent()) {
      const res = await API.supplyList({ status:1, size:200 })
      if (res) supplies = res.data.list || []
    }
    loadList(1)
  }

  async function loadList(page = 1) {
    const status = document.getElementById('status-filter').value || undefined
    // onlyMine: 学生看自己，教师/管理员看全部
    const onlyMine = Auth.isStudent()

    document.getElementById('app-tbody').innerHTML =
            `<tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>`

    const res = await API.applicationList({ onlyMine, status, page, size: 15 })
    if (!res) return
    const list = res.data.list || []

    if (!list.length) {
      document.getElementById('app-tbody').innerHTML =
              `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div>
        <p>${Auth.isStudent() ? '您还没有领用申请，点击右上角新建申请' : '暂无申请记录'}</p>
      </div></td></tr>`
      document.getElementById('pagination').innerHTML = ''
      return
    }

    document.getElementById('app-tbody').innerHTML = list.map(r => `
    <tr>
      <td style="font-size:12px;color:var(--text-2)">${fmtDate(r.applyTime)}</td>
      <td>
        <div style="font-weight:500">${escHtml(r.supplyName||'-')}</div>
        <div style="font-size:11px;color:var(--text-3)">${escHtml(r.supplyCode||'')}</div>
      </td>
      <td style="font-weight:600">${r.quantity}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)"
          title="${escHtml(r.purpose)}">${escHtml(r.purpose)}</td>
      <td>${statusTag(r.status)}</td>
      <td style="font-size:12px">${escHtml(r.approverName||'-')}</td>
      <td style="font-size:12px;color:${r.status==='REJECTED'?'var(--danger)':'var(--text-2)'}">
        ${r.status==='REJECTED'
            ? escHtml(r.rejectReason||'-')
            : escHtml(r.approveRemark||'-')}
      </td>
      <td style="font-size:12px;color:var(--text-2)">${fmtDate(r.approveTime)||'-'}</td>
    </tr>`).join('')

    renderPagination('pagination', res.data, p => loadList(p))
  }

  function openApplyModal() {
    if (!supplies.length) { Toast.warning('暂无可申请的耗材'); return }
    const opts = supplies.map(s =>
            `<option value="${s.id}">[${escHtml(s.code)}] ${escHtml(s.name)} — 库存:${s.quantity}${s.unit}</option>`
    ).join('')

    Modal.show('新建领用申请', `
    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label">选择耗材 <span class="required">*</span></label>
      <select class="form-select" id="apply-supply" style="width:100%" onchange="updateStock(this)">
        <option value="">请选择耗材</option>${opts}
      </select>
    </div>
    <div style="padding:10px 12px;background:#f5f8fc;border-radius:8px;margin-bottom:16px;font-size:13px" id="stock-hint" style="display:none">
      请先选择耗材
    </div>
    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label">申请数量 <span class="required">*</span></label>
      <input class="form-input" id="apply-qty" type="number" min="1" placeholder="请输入申请数量" style="width:100%" />
    </div>
    <div class="form-group">
      <label class="form-label">用途说明 <span class="required">*</span></label>
      <textarea class="form-textarea" id="apply-purpose" style="width:100%"
        placeholder="请详细说明本次领用的实验名称和使用目的，教师审批时需参考此信息"></textarea>
    </div>
  `, async () => {
      const supplyId = document.getElementById('apply-supply').value
      const qty      = parseInt(document.getElementById('apply-qty').value)
      const purpose  = document.getElementById('apply-purpose').value.trim()
      if (!supplyId)        { Toast.warning('请选择耗材'); return false }
      if (!qty || qty < 1)  { Toast.warning('请输入有效的申请数量'); return false }
      if (!purpose)         { Toast.warning('请填写用途说明'); return false }
      const res = await API.apply({ supplyId: Number(supplyId), quantity: qty, purpose })
      if (!res) return false
      Toast.success('申请已提交，请等待教师审批')
      loadList(1)
    }, '提交申请')
  }

  function updateStock(sel) {
    const id = sel.value
    const hint = document.getElementById('stock-hint')
    if (!id) { hint.textContent = '请先选择耗材'; return }
    const s = supplies.find(s => s.id == id)
    if (s) {
      hint.innerHTML = `当前库存：<strong style="color:${s.quantity<=s.warningQuantity?'var(--warning)':'var(--success)'}">${s.quantity} ${s.unit}</strong>${s.isHazardous?'&nbsp;<span class="tag tag-danger" style="font-size:11px">危险品</span>':''}&nbsp;&nbsp;存储条件：<span style="color:var(--text-2)">${s.storageCondition||'常温'}</span>`
    }
  }

  init()
</script>
</body>
</html>
