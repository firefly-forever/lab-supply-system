<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>耗材管理 — 实验室耗材管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
    <div class="main-wrap">
        <header class="header">
            <div class="header-title">耗材管理</div>
            <div class="header-right">
                <div class="warning-pill" id="header-warning-pill" style="display:none"
                     onclick="window.location.href='supply.html'">
                    ⚠️ <span class="warn-count"></span>
                </div>
            </div>
        </header>
        <main class="main-content">
            <div class="card">
                <!-- 工具栏 -->
                <div class="toolbar">
                    <input class="search-input" id="keyword" placeholder="搜索耗材名/编号/厂家" oninput="debounceSearch()" />
                    <select class="search-select" id="cat-filter" onchange="loadList(1)">
                        <option value="">全部分类</option>
                    </select>
                    <select class="search-select" id="status-filter" onchange="loadList(1)">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">停用</option>
                    </select>
                    <div style="flex:1"></div>
                    <button class="btn btn-primary" id="add-btn" style="display:none" onclick="openAddModal()">
                        ➕ 新增耗材
                    </button>
                </div>

                <!-- 表格 -->
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>编号</th>
                            <th>耗材名称</th>
                            <th>分类</th>
                            <th>规格</th>
                            <th>库存</th>
                            <th>预警阈值</th>
                            <th>存储条件</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="supply-tbody">
                        <tr><td colspan="9"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>
</div>

<!-- 新增/编辑弹窗内容（由 Modal.show 注入） -->
<script src="config.js"></script>
<script src="layout.js"></script>
<script>
    Layout.render('supply')

    let categories = []
    let currentPage = 1
    let searchTimer = null

    // 是否管理员（管理员才能新增/编辑）
    if (Auth.isAdmin()) {
        document.getElementById('add-btn').style.display = 'inline-flex'
    }

    async function init() {
        const res = await API.categoryList()
        if (!res) return
        categories = res.data || []
        const sel = document.getElementById('cat-filter')
        categories.forEach(c => {
            const o = document.createElement('option')
            o.value = c.id; o.textContent = c.name
            sel.appendChild(o)
        })
        loadList(1)
    }

    async function loadList(page = 1) {
        currentPage = page
        const keyword  = document.getElementById('keyword').value.trim()
        const catId    = document.getElementById('cat-filter').value
        const status   = document.getElementById('status-filter').value

        document.getElementById('supply-tbody').innerHTML =
            `<tr><td colspan="9"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>`

        const res = await API.supplyList({ keyword: keyword||undefined, categoryId: catId||undefined, status: status||undefined, page, size: 12 })
        if (!res) return

        const list = res.data.list || []
        if (list.length === 0) {
            document.getElementById('supply-tbody').innerHTML =
                `<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">📦</div><p>暂无耗材数据</p></div></td></tr>`
            document.getElementById('pagination').innerHTML = ''
            return
        }

        document.getElementById('supply-tbody').innerHTML = list.map(it => {
            const isLow = it.quantity <= it.warningQuantity
            return `
    <tr>
      <td><code style="font-size:12px;background:#f5f8fc;padding:2px 6px;border-radius:4px">${escHtml(it.code)}</code></td>
      <td>
        <div style="font-weight:500">${escHtml(it.name)}</div>
        ${it.isHazardous ? '<span class="tag tag-danger" style="font-size:11px">⚠危险品</span>' : ''}
      </td>
      <td>${escHtml(it.categoryName || '-')}</td>
      <td style="color:var(--text-2)">${escHtml(it.specification || '-')}</td>
      <td>
        <span style="font-weight:600;color:${it.quantity === 0 ? 'var(--danger)' : isLow ? 'var(--warning)' : 'var(--success)'}">
          ${it.quantity}
        </span> ${escHtml(it.unit)}
        ${isLow ? `<span class="tag tag-warning" style="margin-left:4px;font-size:11px">⚠低库存</span>` : ''}
      </td>
      <td>${it.warningQuantity} ${escHtml(it.unit)}</td>
      <td style="font-size:12px;color:var(--text-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${escHtml(it.storageCondition||'')}">
        ${escHtml(it.storageCondition || '-')}
      </td>
      <td>${it.status === 1 ? '<span class="tag tag-success">正常</span>' : '<span class="tag tag-info">停用</span>'}</td>
      <td>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${Auth.isAdmin() ? `
            <button class="btn btn-ghost btn-xs" onclick="openEditModal(${it.id})">编辑</button>
            <button class="btn btn-xs ${it.status===1?'btn-danger':'btn-success'}"
                    onclick="toggleStatus(${it.id},${it.status})">
              ${it.status===1?'停用':'启用'}
            </button>
          ` : ''}
          ${Auth.isStudent() ? `
            <button class="btn btn-primary btn-xs" onclick="openApplyModal(${it.id},'${escHtml(it.name)}',${it.quantity},'${escHtml(it.unit)}')">申请领用</button>
          ` : ''}
        </div>
      </td>
    </tr>`
        }).join('')

        renderPagination('pagination', res.data, (p) => loadList(p))
    }

    function debounceSearch() {
        clearTimeout(searchTimer)
        searchTimer = setTimeout(() => loadList(1), 400)
    }

    // ── 新增 ──
    function openAddModal() {
        Modal.show('新增耗材', buildForm(null), async () => {
            const data = collectForm()
            if (!data) return false
            const res = await API.supplyAdd(data)
            if (!res) return false
            Toast.success('耗材添加成功')
            loadList(currentPage)
        })
    }

    // ── 编辑 ──
    async function openEditModal(id) {
        const res = await API.supplyDetail(id)
        if (!res) return
        Modal.show('编辑耗材', buildForm(res.data), async () => {
            const data = collectForm()
            if (!data) return false
            data.id = id
            const r = await API.supplyUpdate(data)
            if (!r) return false
            Toast.success('更新成功')
            loadList(currentPage)
        })
    }

    // ── 停用/启用 ──
    async function toggleStatus(id, current) {
        const newStatus = current === 1 ? 0 : 1
        Modal.confirm(`确认${newStatus===0?'停用':'启用'}该耗材？`, async () => {
            const res = await API.supplyStatus(id, newStatus)
            if (!res) return false
            Toast.success(newStatus===0?'已停用':'已启用')
            loadList(currentPage)
        })
    }

    // ── 学生申请领用（快捷入口）──
    function openApplyModal(id, name, qty, unit) {
        Modal.show(`申请领用：${name}`, `
    <div class="form-group">
      <label class="form-label">当前库存</label>
      <div style="padding:8px 0;color:var(--text-2)">${qty} ${unit}</div>
    </div>
    <div class="form-group">
      <label class="form-label">申请数量 <span class="required">*</span></label>
      <input class="form-input" id="apply-qty" type="number" min="1" max="${qty}" placeholder="请输入申请数量" />
    </div>
    <div class="form-group">
      <label class="form-label">用途说明 <span class="required">*</span></label>
      <textarea class="form-textarea" id="apply-purpose" placeholder="请详细说明本次领用用途（实验名称/目的）"></textarea>
    </div>
  `, async () => {
            const qty2   = parseInt(document.getElementById('apply-qty').value)
            const purpose = document.getElementById('apply-purpose').value.trim()
            if (!qty2 || qty2 < 1) { Toast.warning('请输入有效的申请数量'); return false }
            if (!purpose)           { Toast.warning('请填写用途说明'); return false }
            const res = await API.apply({ supplyId: id, quantity: qty2, purpose })
            if (!res) return false
            Toast.success('申请已提交，等待教师审批')
        }, '提交申请')
    }

    // ── 表单构建 ──
    function buildForm(item) {
        const catOptions = categories.map(c =>
            `<option value="${c.id}" ${item?.categoryId==c.id?'selected':''}>${escHtml(c.name)}</option>`
        ).join('')
        return `
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">耗材名称 <span class="required">*</span></label>
      <input class="form-input" id="f-name" value="${escHtml(item?.name||'')}" placeholder="如：无水乙醇" />
    </div>
    <div class="form-group">
      <label class="form-label">耗材编号 <span class="required">*</span></label>
      <input class="form-input" id="f-code" value="${escHtml(item?.code||'')}" placeholder="如：CHEM-001" />
    </div>
    <div class="form-group">
      <label class="form-label">所属分类 <span class="required">*</span></label>
      <select class="form-select" id="f-cat">${catOptions}</select>
    </div>
    <div class="form-group">
      <label class="form-label">计量单位 <span class="required">*</span></label>
      <input class="form-input" id="f-unit" value="${escHtml(item?.unit||'瓶')}" placeholder="如：瓶、管、包" />
    </div>
    <div class="form-group full">
      <label class="form-label">规格型号</label>
      <input class="form-input" id="f-spec" value="${escHtml(item?.specification||'')}" placeholder="如：500mL/瓶，分析纯AR" />
    </div>
    <div class="form-group full">
      <label class="form-label">生产厂家</label>
      <input class="form-input" id="f-mfr" value="${escHtml(item?.manufacturer||'')}" placeholder="厂家名称" />
    </div>
    <div class="form-group full">
      <label class="form-label">存储条件</label>
      <input class="form-input" id="f-storage" value="${escHtml(item?.storageCondition||'')}" placeholder="如：2-8℃避光保存" />
    </div>
    <div class="form-group">
      <label class="form-label">低库存预警阈值</label>
      <input class="form-input" id="f-warn" type="number" value="${item?.warningQuantity||10}" />
      <span class="form-hint">库存低于此值时在首页预警</span>
    </div>
    <div class="form-group">
      <label class="form-label">是否危险品</label>
      <select class="form-select" id="f-hazard">
        <option value="0" ${item?.isHazardous==0?'selected':''}>否</option>
        <option value="1" ${item?.isHazardous==1?'selected':''}>是</option>
      </select>
    </div>
    <div class="form-group full">
      <label class="form-label">备注</label>
      <textarea class="form-textarea" id="f-remark" style="min-height:60px">${escHtml(item?.remark||'')}</textarea>
    </div>
  </div>`
    }

    function collectForm() {
        const name = document.getElementById('f-name').value.trim()
        const code = document.getElementById('f-code').value.trim()
        const catId = document.getElementById('f-cat').value
        const unit  = document.getElementById('f-unit').value.trim()
        if (!name) { Toast.warning('请输入耗材名称'); return null }
        if (!code) { Toast.warning('请输入耗材编号'); return null }
        if (!unit) { Toast.warning('请输入计量单位'); return null }
        return {
            name, code, categoryId: Number(catId), unit,
            specification:   document.getElementById('f-spec').value.trim() || null,
            manufacturer:    document.getElementById('f-mfr').value.trim()  || null,
            storageCondition:document.getElementById('f-storage').value.trim() || null,
            warningQuantity: Number(document.getElementById('f-warn').value) || 10,
            isHazardous:     Number(document.getElementById('f-hazard').value),
            remark:          document.getElementById('f-remark').value.trim() || null
        }
    }

    init()
</script>
</body>
</html>
