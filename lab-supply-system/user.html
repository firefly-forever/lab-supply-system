<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>用户管理 — 实验室耗材管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
    <div class="main-wrap">
        <header class="header">
            <div class="header-title">用户管理</div>
            <div class="header-right">
                <div class="warning-pill" id="header-warning-pill" style="display:none"
                     onclick="window.location.href='supply.html'">⚠️ <span class="warn-count"></span></div>
            </div>
        </header>
        <main class="main-content">
            <div class="card">
                <div class="page-header">
                    <div class="page-title">系统用户列表</div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>用户名</th><th>真实姓名</th><th>角色</th>
                            <th>院系/科室</th><th>联系电话</th><th>状态</th>
                            <th>注册时间</th><th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="user-tbody">
                        <tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="config.js"></script>
<script src="layout.js"></script>
<script>
    Layout.render('user')
    if (!Auth.isAdmin()) {
        Toast.error('仅管理员可访问用户管理')
        setTimeout(() => history.back(), 1500)
    }

    const currentUserId = Auth.getUser()?.userId

    async function loadUsers() {
        const res = await API.userList()
        if (!res) return
        const list = res.data || []
        if (!list.length) {
            document.getElementById('user-tbody').innerHTML =
                `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">👥</div><p>暂无用户数据</p></div></td></tr>`
            return
        }
        document.getElementById('user-tbody').innerHTML = list.map(u => `
    <tr>
      <td><code style="font-size:13px">${escHtml(u.username)}</code></td>
      <td style="font-weight:500">${escHtml(u.realName||'-')}</td>
      <td>${roleTag(u.role)}</td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(u.department||'-')}</td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(u.phone||'-')}</td>
      <td>${u.status===1
            ? '<span class="tag tag-success">启用</span>'
            : '<span class="tag tag-info">禁用</span>'}</td>
      <td style="font-size:12px;color:var(--text-2)">${fmtDate(u.createTime)}</td>
      <td>
        ${u.id !== currentUserId ? `
          <button class="btn btn-xs ${u.status===1?'btn-danger':'btn-success'}"
                  onclick="toggleUserStatus(${u.id}, ${u.status}, '${escHtml(u.realName)}')">
            ${u.status===1?'禁用':'启用'}
          </button>` : '<span style="color:var(--text-3);font-size:12px">（当前账号）</span>'}
      </td>
    </tr>`).join('')
    }

    async function toggleUserStatus(id, current, name) {
        const newStatus = current === 1 ? 0 : 1
        Modal.confirm(
            `确认${newStatus===0?'禁用':'启用'}用户「${name}」？${newStatus===0?'禁用后该用户将无法登录。':''}`,
            async () => {
                const res = await API.userStatus(id, newStatus)
                if (!res) return false
                Toast.success(newStatus===0?`已禁用用户：${name}`:`已启用用户：${name}`)
                loadUsers()
            }
        )
    }

    loadUsers()
</script>
</body>
</html>
