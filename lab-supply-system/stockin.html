<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>入库管理 — 实验室耗材管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
    <div class="main-wrap">
        <header class="header">
            <div class="header-title">入库管理</div>
            <div class="header-right">
                <div class="warning-pill" id="header-warning-pill" style="display:none"
                     onclick="window.location.href='supply.html'">⚠️ <span class="warn-count"></span></div>
            </div>
        </header>
        <main class="main-content">
            <div class="card">
                <div class="page-header">
                    <div class="page-title">入库记录</div>
                    <button class="btn btn-primary" onclick="openStockInModal()">📥 新增入库</button>
                </div>

                <div class="toolbar">
                    <select class="search-select" id="supply-filter" onchange="loadList(1)" style="width:200px">
                        <option value="">全部耗材</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>入库时间</th><th>耗材名称</th><th>批次号</th>
                            <th>入库数量</th><th>单价</th><th>有效期</th>
                            <th>供应商</th><th>操作人</th>
                        </tr>
                        </thead>
                        <tbody id="stockin-tbody">
                        <tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>
</div>

<script src="config.js"></script>
<script src="layout.js"></script>
<script>
    Layout.render('stockin')
    // 仅管理员可访问
    if (!Auth.isAdmin()) { Toast.error('仅管理员可访问入库管理'); setTimeout(()=>history.back(),1500) }

    let supplies = []
    let currentPage = 1

    async function init() {
        const res = await API.supplyList({ status: 1, size: 200 })
        if (!res) return
        supplies = res.data.list || []
        const sel = document.getElementById('supply-filter')
        supplies.forEach(s => {
            const o = document.createElement('option')
            o.value = s.id; o.textContent = `${s.code} · ${s.name}`
            sel.appendChild(o)
        })
        loadList(1)
    }

    async function loadList(page = 1) {
        currentPage = page
        const supplyId = document.getElementById('supply-filter').value || undefined
        document.getElementById('stockin-tbody').innerHTML =
            `<tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>`
        const res = await API.stockInList({ supplyId, page, size: 15 })
        if (!res) return
        const list = res.data.list || []
        if (!list.length) {
            document.getElementById('stockin-tbody').innerHTML =
                `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📥</div><p>暂无入库记录</p></div></td></tr>`
            document.getElementById('pagination').innerHTML = ''
            return
        }
        document.getElementById('stockin-tbody').innerHTML = list.map(r => `
    <tr>
      <td style="color:var(--text-2);font-size:12px">${fmtDate(r.createTime)}</td>
      <td><span style="font-weight:500">${escHtml(r.supplyName||'-')}</span>
          <br><span style="font-size:11px;color:var(--text-3)">${escHtml(r.supplyCode||'')}</span></td>
      <td><code style="font-size:12px">${escHtml(r.batchNo||'-')}</code></td>
      <td><span style="font-weight:600;color:var(--success)">+${r.quantity}</span></td>
      <td>${r.unitPrice != null ? `¥${r.unitPrice}` : '-'}</td>
      <td style="font-size:12px">${r.expiryDate || '-'}</td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(r.supplier||'-')}</td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(r.operatorName||'-')}</td>
    </tr>`).join('')
        renderPagination('pagination', res.data, p => loadList(p))
    }

    function openStockInModal() {
        const opts = supplies.map(s =>
            `<option value="${s.id}">[${escHtml(s.code)}] ${escHtml(s.name)} (库存:${s.quantity}${s.unit})</option>`
        ).join('')
        Modal.show('新增入库', `
    <div class="form-grid">
      <div class="form-group full">
        <label class="form-label">选择耗材 <span class="required">*</span></label>
        <select class="form-select" id="in-supply"><option value="">请选择耗材</option>${opts}</select>
      </div>
      <div class="form-group">
        <label class="form-label">入库数量 <span class="required">*</span></label>
        <input class="form-input" id="in-qty" type="number" min="1" placeholder="请输入数量" />
      </div>
      <div class="form-group">
        <label class="form-label">批次号</label>
        <input class="form-input" id="in-batch" placeholder="生产批号" />
      </div>
      <div class="form-group">
        <label class="form-label">单价（元）</label>
        <input class="form-input" id="in-price" type="number" step="0.01" placeholder="可选" />
      </div>
      <div class="form-group">
        <label class="form-label">生产日期</label>
        <input class="form-input" id="in-prod" type="date" />
      </div>
      <div class="form-group">
        <label class="form-label">有效期至</label>
        <input class="form-input" id="in-expiry" type="date" />
      </div>
      <div class="form-group full">
        <label class="form-label">供应商</label>
        <input class="form-input" id="in-supplier" placeholder="供应商名称" />
      </div>
      <div class="form-group full">
        <label class="form-label">备注</label>
        <textarea class="form-textarea" id="in-remark" style="min-height:56px"></textarea>
      </div>
    </div>`, async () => {
            const supplyId = document.getElementById('in-supply').value
            const qty      = parseInt(document.getElementById('in-qty').value)
            if (!supplyId) { Toast.warning('请选择耗材'); return false }
            if (!qty || qty < 1) { Toast.warning('请输入有效的入库数量'); return false }
            const data = {
                supplyId: Number(supplyId), quantity: qty,
                batchNo:  document.getElementById('in-batch').value.trim()||null,
                unitPrice:document.getElementById('in-price').value||null,
                productionDate:document.getElementById('in-prod').value||null,
                expiryDate:document.getElementById('in-expiry').value||null,
                supplier: document.getElementById('in-supplier').value.trim()||null,
                remark:   document.getElementById('in-remark').value.trim()||null
            }
            const res = await API.stockIn(data)
            if (!res) return false
            Toast.success('入库成功！')
            // 刷新供应列表中的库存数
            const s = supplies.find(s => s.id === Number(supplyId))
            if (s) s.quantity += qty
            loadList(currentPage)
        }, '确认入库')
    }

    init()
</script>
</body>
</html>
