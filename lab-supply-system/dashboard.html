<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>首页总览 — 实验室耗材管理系统</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .two-col { display:grid; grid-template-columns:1fr 380px; gap:20px; margin-top:20px; }
        .section-hd {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:16px;
        }
        .section-hd-title { font-size:15px; font-weight:600; color:var(--text-1);
            display:flex; align-items:center; gap:6px; }
        .todo-item {
            display:flex; align-items:center; gap:12px;
            padding:12px; border-radius:8px; background:#f8fafc;
            cursor:pointer; transition:background .15s; margin-bottom:8px;
        }
        .todo-item:hover { background:#edf4ff; }
        .todo-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .todo-dot.w { background:var(--warning); }
        .todo-dot.d { background:var(--danger); }
        .todo-body { flex:1; }
        .todo-t { font-size:14px; font-weight:500; }
        .todo-s { font-size:12px; color:var(--text-3); margin-top:2px; }
        .shortcut-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .sc-item {
            padding:16px; background:#f5f8fc; border-radius:10px;
            cursor:pointer; text-align:center; transition:all .15s;
            font-size:13px; color:var(--text-2);
        }
        .sc-item:hover { background:var(--primary-light); color:var(--primary);
            transform:translateY(-2px); box-shadow:0 4px 12px rgba(26,111,175,.15); }
        .sc-item .sc-icon { font-size:22px; margin-bottom:6px; }
    </style>
</head>
<body>
<div class="layout">
    <!-- 侧边栏由 layout.js 注入 -->
    <div class="main-wrap">
        <header class="header">
            <div class="header-title">首页总览</div>
            <div class="header-right">
                <div class="warning-pill" id="header-warning-pill" style="display:none"
                     onclick="window.location.href='supply.html'">
                    ⚠️ <span class="warn-count"></span>
                </div>
                <span id="header-user" style="font-size:13px;color:var(--text-2)"></span>
            </div>
        </header>
        <main class="main-content">

            <!-- 统计卡片 -->
            <div class="stat-grid" id="stat-grid">
                <div class="loading-mask"><div class="spinner"></div>加载中...</div>
            </div>

            <div class="two-col">
                <!-- 左：低库存预警 -->
                <div class="card">
                    <div class="section-hd">
                        <div class="section-hd-title">⚠️ 低库存预警</div>
                        <a href="supply.html" class="btn btn-ghost btn-sm">查看全部 →</a>
                    </div>
                    <div id="warning-list"><div class="loading-mask"><div class="spinner"></div>加载中...</div></div>
                </div>

                <!-- 右：待办 + 快捷入口 -->
                <div>
                    <div class="card">
                        <div class="section-hd">
                            <div class="section-hd-title">🔔 待办事项</div>
                        </div>
                        <div id="todo-list"></div>
                    </div>

                    <div class="card" style="margin-top:18px">
                        <div class="section-hd-title" style="margin-bottom:14px">⚡ 快捷入口</div>
                        <div class="shortcut-grid" id="shortcut-grid"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="config.js"></script>
<script src="layout.js"></script>
<script>
    Layout.render('dashboard')
    document.getElementById('header-user').textContent = Auth.getUser()?.realName || ''

    async function loadDashboard() {
        const res = await API.dashboard()
        if (!res) return
        const d = res.data

        // 统计卡片
        const stats = [
            { icon:'📦', label:'耗材种数',   val:d.totalSupplyCount,        c:'#1a6faf' },
            { icon:'⚠️', label:'低库存预警', val:d.lowStockCount,           c:'#e67e22' },
            { icon:'📋', label:'待审批申请', val:d.pendingApplicationCount,  c:'#9b59b6' },
            { icon:'📥', label:'今日入库',   val:d.todayStockInCount || 0,  c:'#27ae60' }
        ]
        document.getElementById('stat-grid').innerHTML = stats.map(s => `
    <div class="stat-card" style="--c:${s.c}">
      <div class="stat-icon">${s.icon}</div>
      <div><div class="stat-val">${s.val}</div><div class="stat-label">${s.label}</div></div>
    </div>
  `).join('')

        // 低库存列表
        const items = d.lowStockItems || []
        if (items.length === 0) {
            document.getElementById('warning-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✅</div>
        <p>所有耗材库存充足，无预警</p>
      </div>`
        } else {
            document.getElementById('warning-list').innerHTML = items.map(it => `
      <div class="warning-item ${it.quantity === 0 ? 'critical' : ''}">
        <div>
          ${it.isHazardous ? '<span class="tag tag-danger" style="margin-right:6px;font-size:11px">危险品</span>' : ''}
          <span class="w-name">${escHtml(it.name)}</span>
          <span class="w-spec">${escHtml(it.specification || '')}</span>
        </div>
        <div class="w-stock ${it.quantity === 0 ? 'zero' : ''}">
          ${it.quantity === 0 ? '⛔ 已断货' : `剩余 ${it.quantity} ${it.unit}`}
        </div>
      </div>
    `).join('')
        }

        // 待办
        const user = Auth.getUser()
        let todoHtml = ''
        if (['TEACHER','ADMIN'].includes(user.role) && d.pendingApplicationCount > 0) {
            todoHtml += `
      <div class="todo-item" onclick="window.location.href='approve.html'">
        <div class="todo-dot w"></div>
        <div class="todo-body">
          <div class="todo-t">有 ${d.pendingApplicationCount} 条领用申请待审批</div>
          <div class="todo-s">点击前往审批管理</div>
        </div>
        <span>›</span>
      </div>`
        }
        if (user.role === 'ADMIN' && d.lowStockCount > 0) {
            todoHtml += `
      <div class="todo-item" onclick="window.location.href='stockin.html'">
        <div class="todo-dot d"></div>
        <div class="todo-body">
          <div class="todo-t">${d.lowStockCount} 种耗材库存不足</div>
          <div class="todo-s">点击前往入库补货</div>
        </div>
        <span>›</span>
      </div>`
        }
        if (!todoHtml) {
            todoHtml = `<div class="empty-state" style="padding:24px">
      <div>✅</div><p style="margin-top:8px">暂无待办事项</p></div>`
        }
        document.getElementById('todo-list').innerHTML = todoHtml

        // 快捷入口
        const allSc = [
            { icon:'📦', label:'耗材列表', href:'supply.html',      roles:['ADMIN','TEACHER','STUDENT'] },
            { icon:'📥', label:'入库操作', href:'stockin.html',     roles:['ADMIN'] },
            { icon:'📋', label:'领用申请', href:'application.html', roles:['STUDENT','TEACHER'] },
            { icon:'✅', label:'审批管理', href:'approve.html',     roles:['ADMIN','TEACHER'] },
        ]
        const sc = allSc.filter(s => s.roles.includes(user.role))
        document.getElementById('shortcut-grid').innerHTML = sc.map(s => `
    <div class="sc-item" onclick="window.location.href='${s.href}'">
      <div class="sc-icon">${s.icon}</div>
      <div>${s.label}</div>
    </div>
  `).join('')
    }

    loadDashboard()
</script>
</body>
</html>
