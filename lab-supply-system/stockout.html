<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>出库记录 — 实验室耗材管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
    <div class="main-wrap">
        <header class="header">
            <div class="header-title">出库记录</div>
            <div class="header-right">
                <div class="warning-pill" id="header-warning-pill" style="display:none"
                     onclick="window.location.href='supply.html'">⚠️ <span class="warn-count"></span></div>
            </div>
        </header>
        <main class="main-content">
            <div class="card">
                <div class="page-header">
                    <div class="page-title">出库记录列表</div>
                </div>
                <div class="toolbar">
                    <select class="search-select" id="supply-filter" onchange="loadList(1)" style="width:220px">
                        <option value="">全部耗材</option>
                    </select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>出库时间</th><th>耗材名称</th><th>出库数量</th>
                            <th>出库类型</th><th>领用人</th><th>操作人</th><th>备注</th>
                        </tr>
                        </thead>
                        <tbody id="out-tbody">
                        <tr><td colspan="7"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>
</div>
<script src="config.js"></script>
<script src="layout.js"></script>
<script>
    Layout.render('stockout')
    const outTypeMap = { APPLY:'申请领用', DIRECT:'直接出库', SCRAP:'报废' }
    const outTypeTag = { APPLY:'tag-primary', DIRECT:'tag-warning', SCRAP:'tag-danger' }

    async function init() {
        const res = await API.supplyList({ status:1, size:200 })
        if (!res) return
        const sel = document.getElementById('supply-filter')
        ;(res.data.list||[]).forEach(s => {
            const o = document.createElement('option')
            o.value = s.id; o.textContent = `${s.code} · ${s.name}`
            sel.appendChild(o)
        })
        loadList(1)
    }

    async function loadList(page = 1) {
        const supplyId = document.getElementById('supply-filter').value || undefined
        document.getElementById('out-tbody').innerHTML =
            `<tr><td colspan="7"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>`
        const res = await API.stockOutList({ supplyId, page, size:15 })
        if (!res) return
        const list = res.data.list || []
        if (!list.length) {
            document.getElementById('out-tbody').innerHTML =
                `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📤</div><p>暂无出库记录</p></div></td></tr>`
            document.getElementById('pagination').innerHTML = ''
            return
        }
        document.getElementById('out-tbody').innerHTML = list.map(r => `
    <tr>
      <td style="font-size:12px;color:var(--text-2)">${fmtDate(r.createTime)}</td>
      <td>
        <div style="font-weight:500">${escHtml(r.supplyName||'-')}</div>
        <div style="font-size:11px;color:var(--text-3)">${escHtml(r.supplyCode||'')}</div>
      </td>
      <td style="font-weight:600;color:var(--danger)">-${r.quantity}</td>
      <td><span class="tag ${outTypeTag[r.outType]||'tag-info'}">${outTypeMap[r.outType]||r.outType}</span></td>
      <td style="font-size:12px">${escHtml(r.receiverName||'-')}</td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(r.operatorName||'-')}</td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(r.remark||'-')}</td>
    </tr>`).join('')
        renderPagination('pagination', res.data, p => loadList(p))
    }
    init()
</script>
</body>
</html>
