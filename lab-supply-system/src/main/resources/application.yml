server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lab-supply-system

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # ⚠️ 请根据实际环境修改数据库连接信息
      url: jdbc:mysql://localhost:3306/lab_supply_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 连接检测
      test-while-idle: true
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      # SQL监控（开发阶段可开启）
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包别名（可在XML中直接使用类名）
  type-aliases-package: com.majorlink.lab.entity
  configuration:
    # 驼峰命名转换（数据库下划线 -> Java驼峰）
    map-underscore-to-camel-case: true
    # 开发阶段输出SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 自定义配置
lab:
  jwt:
    # JWT密钥（生产环境请改为更复杂的随机字符串）
    secret: MajorLink-Lab-Supply-System-Secret-Key-2024
    # Token有效期（单位：秒），默认8小时
    expire: 28800
  # 低库存预警阈值（默认10）
  warning:
    low-stock-threshold: 10
  # 临期预警天数（默认30天）
    expiry-days: 30

logging:
  level:
    com.majorlink.lab.mapper: debug
    com.majorlink.lab: info
