<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>审批管理 — 实验室耗材管理系统</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .approve-actions { display:flex; gap:6px; }
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .detail-row  { padding:8px 0; border-bottom:1px solid var(--border); }
        .detail-label{ font-size:12px; color:var(--text-3); margin-bottom:4px; }
        .detail-val  { font-size:13px; color:var(--text-1); font-weight:500; }
        .remark-box  { margin-top:16px; }
    </style>
</head>
<body>
<div class="layout">
    <div class="main-wrap">
        <header class="header">
            <div class="header-title">审批管理</div>
            <div class="header-right">
                <div class="warning-pill" id="header-warning-pill" style="display:none"
                     onclick="window.location.href='supply.html'">⚠️ <span class="warn-count"></span></div>
            </div>
        </header>
        <main class="main-content">
            <div class="card">
                <div class="page-header">
                    <div class="page-title">
                        领用申请列表
                        <span class="tag tag-warning" id="pending-badge" style="display:none;margin-left:8px"></span>
                    </div>
                </div>

                <div class="toolbar">
                    <select class="search-select" id="status-filter" onchange="loadList(1)">
                        <option value="PENDING">待审批</option>
                        <option value="">全 部</option>
                        <option value="APPROVED">已通过</option>
                        <option value="REJECTED">已拒绝</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>申请时间</th><th>申请人</th><th>院系</th>
                            <th>耗材名称</th><th>申请数量</th><th>用途</th>
                            <th>状态</th><th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="approve-tbody">
                        <tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>
</div>

<script src="config.js"></script>
<script src="layout.js"></script>
<script>
    Layout.render('approve')
    if (!Auth.isTeacherOrAdmin()) {
        Toast.error('仅教师或管理员可访问审批管理')
        setTimeout(() => history.back(), 1500)
    }

    let currentPage = 1

    async function loadList(page = 1) {
        currentPage = page
        const status = document.getElementById('status-filter').value || undefined
        document.getElementById('approve-tbody').innerHTML =
            `<tr><td colspan="8"><div class="loading-mask"><div class="spinner"></div>加载中...</div></td></tr>`

        const res = await API.applicationList({ onlyMine: false, status, page, size: 15 })
        if (!res) return
        const list = res.data.list || []

        // 更新待审批角标
        if (!status || status === 'PENDING') {
            const pending = list.filter(r => r.status === 'PENDING').length
            const badge = document.getElementById('pending-badge')
            if (pending > 0) { badge.textContent = `待审批 ${pending} 条`; badge.style.display = 'inline-flex' }
            else badge.style.display = 'none'
        }

        if (!list.length) {
            document.getElementById('approve-tbody').innerHTML =
                `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">✅</div><p>暂无申请记录</p></div></td></tr>`
            document.getElementById('pagination').innerHTML = ''
            return
        }

        document.getElementById('approve-tbody').innerHTML = list.map(r => `
    <tr>
      <td style="font-size:12px;color:var(--text-2)">${fmtDate(r.applyTime)}</td>
      <td><span style="font-weight:500">${escHtml(r.applicantName||'-')}</span></td>
      <td style="font-size:12px;color:var(--text-2)">${escHtml(r.applicantDepartment||'-')}</td>
      <td>
        <div style="font-weight:500">${escHtml(r.supplyName||'-')}</div>
        <div style="font-size:11px;color:var(--text-3)">${escHtml(r.supplyCode||'')}</div>
      </td>
      <td style="font-weight:600;color:var(--primary)">${r.quantity}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)"
          title="${escHtml(r.purpose)}">${escHtml(r.purpose)}</td>
      <td>${statusTag(r.status)}</td>
      <td>
        <div class="approve-actions">
          <button class="btn btn-ghost btn-xs" onclick="viewDetail(${r.id})">详情</button>
          ${r.status === 'PENDING' ? `
            <button class="btn btn-success btn-xs" onclick="doApprove(${r.id}, true)">✓ 通过</button>
            <button class="btn btn-danger  btn-xs" onclick="doApprove(${r.id}, false)">✕ 拒绝</button>
          ` : ''}
        </div>
      </td>
    </tr>`).join('')

        renderPagination('pagination', res.data, p => loadList(p))
    }

    // 查看详情
    async function viewDetail(id) {
        const res = await API.applicationList({ onlyMine: false, page: 1, size: 200 })
        // 简化：直接用列表里的数据（实际可调用 detail 接口）
        // 这里通过重新查单条（后端有 selectById，但前端无对应API，用 applicationList 代替）
        const item = (res?.data?.list || []).find(r => r.id === id)
        if (!item) { Toast.error('获取详情失败'); return }
        Modal.show('申请详情', `
    <div class="detail-grid">
      <div class="detail-row">
        <div class="detail-label">耗材名称</div>
        <div class="detail-val">${escHtml(item.supplyName||'-')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">耗材编号</div>
        <div class="detail-val"><code>${escHtml(item.supplyCode||'-')}</code></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">申请人</div>
        <div class="detail-val">${escHtml(item.applicantName||'-')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">院系/科室</div>
        <div class="detail-val">${escHtml(item.applicantDepartment||'-')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">申请数量</div>
        <div class="detail-val" style="color:var(--primary);font-size:16px">${item.quantity}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">申请状态</div>
        <div class="detail-val">${statusTag(item.status)}</div>
      </div>
    </div>
    <div class="detail-row" style="margin-top:12px">
      <div class="detail-label">用途说明</div>
      <div class="detail-val" style="margin-top:6px;line-height:1.6;color:var(--text-2)">${escHtml(item.purpose)}</div>
    </div>
    ${item.approveRemark || item.rejectReason ? `
      <div class="detail-row" style="margin-top:12px">
        <div class="detail-label">${item.status==='REJECTED'?'拒绝原因':'审批意见'}</div>
        <div class="detail-val" style="margin-top:6px;color:${item.status==='REJECTED'?'var(--danger)':'var(--text-2)'};line-height:1.6">
          ${escHtml(item.rejectReason || item.approveRemark || '-')}
        </div>
      </div>` : ''}
    ${item.approveTime ? `
      <div class="detail-row" style="margin-top:8px">
        <div class="detail-label">审批时间</div>
        <div class="detail-val" style="color:var(--text-2)">${fmtDate(item.approveTime)}</div>
      </div>` : ''}
  `, () => {}, '关 闭')
        // 把确认按钮改为关闭
        setTimeout(() => {
            const btn = document.getElementById('modal-confirm-btn')
            if (btn) btn.onclick = Modal.close
        }, 50)
    }

    // 快速通过
    async function doApprove(id, approved) {
        if (approved) {
            // 通过：直接显示意见输入框
            Modal.show('审批通过', `
      <p style="color:var(--text-2);margin-bottom:16px">确认通过该领用申请？审批通过后系统将自动扣减库存。</p>
      <div class="form-group">
        <label class="form-label">审批意见（可选）</label>
        <textarea class="form-textarea" id="remark-input" placeholder="如：已审批，请规范操作，注意实验室安全"></textarea>
      </div>
    `, async () => {
                const remark = document.getElementById('remark-input').value.trim()
                const res = await API.approve({ applicationId: id, approved: true, approveRemark: remark||null })
                if (!res) return false
                Toast.success('已审批通过，库存已自动扣减')
                loadList(currentPage)
            }, '确认通过')
        } else {
            // 拒绝：必须填写原因
            Modal.show('审批拒绝', `
      <p style="color:var(--text-2);margin-bottom:16px">请填写拒绝原因，申请人将看到此说明。</p>
      <div class="form-group">
        <label class="form-label">拒绝原因 <span class="required">*</span></label>
        <textarea class="form-textarea" id="reject-reason" placeholder="请说明拒绝原因，如库存不足、申请数量过多、危险品需额外审批等"></textarea>
      </div>
    `, async () => {
                const reason = document.getElementById('reject-reason').value.trim()
                if (!reason) { Toast.warning('请填写拒绝原因'); return false }
                const res = await API.approve({ applicationId: id, approved: false, rejectReason: reason })
                if (!res) return false
                Toast.success('已拒绝该申请')
                loadList(currentPage)
            }, '确认拒绝')
        }
    }

    loadList(1)
</script>
</body>
</html>
